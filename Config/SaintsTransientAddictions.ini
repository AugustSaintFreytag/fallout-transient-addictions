[General]
# The interval in seconds at which the mod checks for addictions to recover from.
# Acts as both optimization and how quickly recovery can occur.
#
# Default: 60
iTickInterval = 60


[Debug]
# Enables detailed PrintC logging for loading, activation, consumption, decay, and recovery.
#
# Default: 0
bDebug = 0


[Recovery]
# Enables addiction recovery based on dependence. Dependence builds with item use and decays over time.
# Once dependence for a given addiction is low enough, the player can recover naturally.
#
# Default: 1
bEnableRecoverySystem = 1

# The display style to use when recovering from an addiction.
# 0 = No message/sound, 1 = Sound only, 2 = Corner message and sound, 3 = Message box with motivational message and sound
#
# Default: 3
iRecoveryMessageMode = 3

# The minimum health the player must have to recover from addictions.
#
# Default: 0.7
fRecoveryMinHealth = 0.7

# The pivot that must be passed under for recovery chance to increase.
# If built dependence for an addiction type is above this value, tending towards zero.
# Once it falls below the pivot, recovery chance will increase.
#
# Default: 0.5
fRecoveryDependencePivot = 0.5

# How much the player's endurance increases their base recovery chance.
#
# Default: 0.1
fRecoveryEnduranceFactor = 0.1

# How much the player's luck increases their base recovery chance.
#
# Default: 0.1
fRecoveryLuckFactor = 0.1


[Addiction]
# Enables dynamic addiction chance adjustment based on current dependence.
# Dependence is tracked per addiction type (withdrawal effect). In contrast to vanilla,
# different items giving the same addiction type are fully supported.
#
# Intended as a wholesale replacement system to Gamebryo's UMON effect.
# Allows working around UMON bugs, like lingering item effects or unapplied withdrawals.
#
# Default: 1
bEnableDependenceBasedAddictionChance = 1

# Purges all UMON effects from ingestible items on game start (requires restart).
# When used with `bEnableDependenceBasedAddictionChance`, effectively disables the game's UMON tracking.
#
# Beware that UMON effects that are still active may have to be purged manually
# once by running `Player.Dispel <ItemId>` per lingering item effect.
#
# Default: 1
bRemoveAllItemUMONEffects = 1

# The number of game hours over which built up item dependence is halved.
#
# Default: 24.0
fDependenceHalfLifeHours = 24.0

# How much dependence is added for the corresponding addiction type for each item use.
#
# Default: 1.0
fDependencePerUse = 1.0

# How much of the item's base addiction chance to build on.
# The resulting chance then increases with repeated item uses.
#
# Default: 0.5
fChanceBaseFactor = 0.5

# How much of built dependence adds to base addiction chance.
# The formula is: base chance * (base factor + dependence * <this>).
#
# At 0.25, four dependence adds one full base chance to the configured base factor.
#
# Default: 0.25
fDependenceChanceContributionFactor = 0.25

# The maximum addiction chance produced by dependence calculation.
# An item's original chance is never reduced if it is already above this value.
#
# Default: 0.95
fChanceMax = 0.95

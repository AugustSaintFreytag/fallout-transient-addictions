[Messages]
# Message templates to use when recovering from an addiction.
sRecoveryMessage0 = "With a lot of endurance, time, and a little bit of luck, you've managed to power through the shakes and jitters. You've recovered from %z addiction!"
sRecoveryMessage1 = "Kicking habits is always hard but you've managed to power through the worst of it. You've recovered from %z addiction!"
sRecoveryMessage2 = "A journey of a thousand miles begins with a single step -- and you've been walking for a while now. You've recovered from %z addiction!"
sRecoveryMessage3 = "They who conquer others are strong; they who conquer themselves are truly powerful. You've recovered from %z addiction!"
sRecoveryMessage4 = "Maintaining solid health has paid off and your body thanks you for it. You've recovered from %z addiction!"
sRecoveryMessage5 = "You feel cleansed after spending time sobering up in the blistering sun of the wasteland. You've recovered from %z addiction!"
sRecoveryMessage6 = "Fall seven times and stand up eight. Your abstinence has paid off, you've recovered from %z addiction!"
sRecoveryMessage7 = "The wasteland breaks most, but not you. Somewhere between the dust and the silence, your body has found its balance again. You've recovered from %z addiction!"
sRecoveryMessage8 = "The chains of habit are too light to be felt until they are too heavy to be broken — you broke yours before it came to that. You've recovered from %z addiction!"
sRecoveryMessage9 = "Discipline is choosing between what you want now and what you want most. Turns out you wanted your health back. You've recovered from %z addiction!"
sRecoveryMessage10 = "Out here, weakness gets you killed. One step at a time, you've clawed your way back from the edge. You've recovered from %z addiction!"
sRecoveryMessage11 = "Even the harshest wasteland winters eventually give way to something better. Your patience and persistence paid off. You've recovered from %z addiction!"
sRecoveryMessage12 = "What doesn't kill you demands a great deal of endurance. You've done the hard work and your body is better for it. You've recovered from %z addiction!"
sRecoveryMessage13 = "The body is remarkably forgiving when you give it the chance. Seems like you finally did. You've recovered from %z addiction!"